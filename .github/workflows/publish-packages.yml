name: Publish GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish @local-hosting/vocab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: https://npm.pkg.github.com
          scope: '@local-hosting'
      - run: |
          corepack enable
          corepack prepare yarn@4.18.1 --activate
      - run: bash scripts/publish-packages.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}