    code: 11
    events: [E_commute]
    labels:
      en: drop off
      es: dejar
  - id: A_notify
    code: 12
    events: [E_dinner, E_errand]
    labels:
      en: notify
      es: avisar
  - id: A_meet
    code: 13
    events: [E_errand]
    labels:
      en: meet
      es: reunirse

